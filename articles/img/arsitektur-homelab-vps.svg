<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Diagram arsitektur homelab dan VPS: internet masuk ke VPS gerbang, aplikasi berat di VPS, data dan orkestrasi di homelab, terhubung tunnel">
  <style>
    .h-box { fill:#121215; stroke:#232329; }
    .h-title { font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; fill:#f4f4f2; }
    .h-sub { font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:#9b9ba4; }
    .h-lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; fill:#55555e; letter-spacing:.08em; }
    .h-arrow { stroke:#55555e; stroke-width:1.5; fill:none; marker-end:url(#harr); }
    .h-tunnel { stroke-dasharray:6 4; }
    .h-ok { stroke:#4ade80; }
    .h-no { stroke:#f87171; }
  </style>
  <defs>
    <marker id="harr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55555e"/>
    </marker>
  </defs>

  <!-- Internet -->
  <ellipse cx="80" cy="186" rx="52" ry="30" fill="#121215" stroke="#6fe3ff" stroke-width="1.5"/>
  <text x="80" y="182" text-anchor="middle" class="h-title">INTERNET</text>
  <text x="80" y="199" text-anchor="middle" class="h-sub">pengguna</text>

  <!-- VPS zone -->
  <rect x="200" y="30" width="220" height="316" rx="14" fill="rgba(111,227,255,0.04)" stroke="#6fe3ff" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="310" y="56" text-anchor="middle" class="h-lbl" fill="#6fe3ff">VPS 1GB — GERBANG PUBLIK</text>

  <rect x="226" y="76" width="168" height="52" rx="10" fill="#121215" stroke="#232329" stroke-width="1.5"/>
  <text x="310" y="98" text-anchor="middle" class="h-title">Reverse proxy</text>
  <text x="310" y="116" text-anchor="middle" class="h-sub">HTTPS, domain</text>

  <rect x="226" y="150" width="168" height="52" rx="10" fill="#121215" stroke="#232329" stroke-width="1.5"/>
  <text x="310" y="172" text-anchor="middle" class="h-title">App berat</text>
  <text x="310" y="190" text-anchor="middle" class="h-sub">bun-free stack, build</text>

  <rect x="226" y="224" width="168" height="52" rx="10" fill="#121215" stroke="#232329" stroke-width="1.5"/>
  <text x="310" y="246" text-anchor="middle" class="h-title">Bot / webhook</text>
  <text x="310" y="264" text-anchor="middle" class="h-sub">online 24/7</text>

  <!-- Homelab zone -->
  <rect x="500" y="30" width="196" height="316" rx="14" fill="rgba(74,222,128,0.04)" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="598" y="56" text-anchor="middle" class="h-lbl" fill="#4ade80">HOMELAB — DATA &amp; EKSPERIMEN</text>

  <rect x="522" y="76" width="152" height="52" rx="10" fill="#121215" stroke="#232329" stroke-width="1.5"/>
  <text x="598" y="98" text-anchor="middle" class="h-title">Database dev</text>
  <text x="598" y="116" text-anchor="middle" class="h-sub">PostgreSQL / MySQL</text>

  <rect x="522" y="150" width="152" height="52" rx="10" fill="#121215" stroke="#232329" stroke-width="1.5"/>
  <text x="598" y="172" text-anchor="middle" class="h-title">Orkestrator AI</text>
  <text x="598" y="190" text-anchor="middle" class="h-sub">cron, agent, API calls</text>

  <rect x="522" y="224" width="152" height="52" rx="10" fill="#121215" stroke="#232329" stroke-width="1.5"/>
  <text x="598" y="246" text-anchor="middle" class="h-title">Docker lab</text>
  <text x="598" y="264" text-anchor="middle" class="h-sub">service internal</text>

  <rect x="522" y="292" width="152" height="40" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="311" text-anchor="middle" class="h-title" font-size="12">✗ LLM lokal, Bun</text>
  <text x="598" y="326" text-anchor="middle" class="h-sub">tanpa AVX2 → SIGILL</text>

  <!-- Arrows internet -> vps -->
  <path class="h-arrow" d="M 132 186 L 196 186"/>
  <text x="164" y="176" text-anchor="middle" class="h-lbl">HTTPS</text>

  <!-- Tunnel vps <-> homelab -->
  <path class="h-arrow h-tunnel h-ok" d="M 394 176 C 440 176, 460 170, 518 122"/>
  <path class="h-arrow h-tunnel h-ok" d="M 518 236 C 460 236, 440 212, 394 200"/>
  <text x="456" y="164" text-anchor="middle" class="h-lbl" fill="#4ade80">TUNNEL</text>
  <text x="456" y="262" text-anchor="middle" class="h-lbl" fill="#4ade80">BACKUP / SYNC</text>

  <!-- Bottom note -->
  <text x="360" y="368" text-anchor="middle" class="h-sub">otak kecil menyuruh di rumah — otot mengangkat di VPS</text>
</svg>
